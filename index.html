<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Plus - 프로젝트 초대</title>
  <style>
    body {
      background-color: #1A1F26;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background-color: #242B35;
      padding: 36px 24px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background-color: rgba(250, 128, 114, 0.2);
      color: #FA8072;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #FFFFFF; }
    p { color: #9EABB8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      background-color: #FA8072;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .btn-secondary {
      background-color: transparent;
      color: #64FFDA;
      border: 1px solid #64FFDA;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">유효시간: 6시간</div>
    <h1>체크리스트 협업 초대</h1>
    <p>Checklist Plus 앱으로 이동하여 프로젝트에 참여합니다.<br>앱이 설치되지 않은 경우 스토어로 이동합니다.</p>
    
    <a id="openAppBtn" class="btn" href="#">앱으로 열기</a>
    <a id="storeBtn" class="btn btn-secondary" href="#">스토어에서 앱 다운로드</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.mono_frame.checklistplus";
    const APP_STORE_URL = "https://apps.apple.com/app/checklist-plus/id000000000";

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const storeUrl = isIOS ? APP_STORE_URL : PLAY_STORE_URL;

    const appDeepLink = token 
      ? `io.supabase.checklistplus://invite?token=${token}` 
      : `io.supabase.checklistplus://`;

    document.getElementById('openAppBtn').href = appDeepLink;
    document.getElementById('storeBtn').href = storeUrl;

    // 모바일 기기에서 접속 시 즉시 앱 열기 시도 -> 1.5초 후 반응 없으면 스토어로 자동 이동
    if (isAndroid || isIOS) {
      window.location.href = appDeepLink;

      setTimeout(function() {
        if (!document.hidden && !document.webkitHidden) {
          window.location.href = storeUrl;
        }
      }, 1500);
    }
  </script>
</body>
</html>
